<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depureco · Generatore Offerte 2026</title>
<link rel="icon" href="assets/depureco-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/brand.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="topbar">
  <div class="brand"><span id="brandLogo"></span><h1>Generatore Offerte</h1></div>
  <div class="spacer"></div>
  <div class="list-wrap"><span id="lbl-list">Listino</span>
    <select id="listSel"><option value="L0">L0</option><option value="LE">LE</option></select></div>
  <div class="lang-wrap"><span>🌐</span>
    <select id="langSel">
      <option value="it">Italiano</option><option value="en">English</option>
      <option value="es">Español</option><option value="fr">Français</option>
      <option value="de">Deutsch</option>
    </select></div>
</div>

<div class="stepper" id="stepper"></div>

<div class="wrap" id="view"></div>

<div class="navbar app-noprint">
  <div class="inner">
    <button class="btn ghost" id="btnPrev">‹ <span id="lbl-prev">Indietro</span></button>
    <button class="btn nav" id="btnNext"><span id="lbl-next">Avanti</span> ›</button>
  </div>
</div>

<!-- dati e configurazione -->
<script src="js/config/brand.js"></script>
<script src="js/data/i18n.js"></script>
<script src="js/data/general-terms.js"></script>
<script src="js/data/catalogo.js"></script>
<script src="js/data/defaults.js"></script>
<!-- applicazione (ordine rilevante: condividono lo scope globale) -->
<script src="js/app/core.js"></script>
<script src="js/app/steps-customer-application.js"></script>
<script src="js/app/step-product.js"></script>
<script src="js/app/step-options.js"></script>
<script src="js/app/quote.js"></script>
<script src="js/app/router.js"></script>
<script src="js/app/persistence.js"></script>
<script src="js/app/folder-pdf.js"></script>
<script src="js/app/xlsx-loader.js"></script>
<script src="js/app/init.js"></script>
</body>
</html>
