/* ==========================================================================
   DEPURECO — design tokens (brand estratto da www.depureco.com, tema Canva-Depureco-V3)
   Rosso #AA1917 · Giallo #FFD017 · Grigio scuro #171717 · Font: Lato (testo) + Bebas Neue (titoli)
   ========================================================================== */
:root{
  /* brand */
  --red:#AA1917; --red-700:#660F0E; --red-300:#BB4745; --red-100:#EED1D1;
  --yellow:#FFD017; --yellow-700:#B29210; --yellow-100:#FFF6D1;
  --navy:#171717; --navy2:#292929;            /* nome storico delle variabili: ora grigio scuro Depureco */
  /* neutri */
  --ink:#171717; --line:#dcdcdc; --soft:#f2f2f2; --muted:#6f6f6f; --white:#fff;
  --steel:#4a4a4a; --steelL:#6e6e6e; --greybar:#ececec; --valtint:#bdbdbd;
  /* tipografia */
  --font-body:'Lato','Helvetica Neue',Arial,sans-serif;
  --font-title:'Bebas Neue','Lato',Impact,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:#f5f5f5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.app-hide{display:none!important}

/* titoli in Bebas Neue (come il sito) */
.topbar h1,.card h2,.hbar .r,.hbar .l,.cover .ctitle,.gc-title,.load-title,.sol .head .nm,.cat .ttl{
  font-family:var(--font-title);font-weight:400;letter-spacing:.05em}
.topbar h1{font-size:20px}.card h2{font-size:26px}.hbar .r{font-size:19px}.hbar .l{font-size:16px}
.cover .ctitle{font-size:26px;font-weight:400}.cover .ctitle .nm{font-size:30px}
.gc-title{font-size:18px}.sol .head .nm{font-size:21px}.cat .ttl{font-size:17px}
/* accenti giallo Depureco */
.step.active{border-color:var(--yellow)}
.btn.prim{box-shadow:0 2px 0 var(--red-700)}
</style>
<style>
/* Generatore Offerte Depureco — layout e componenti (derivato dal generatore Dupuy 2026, ricolorato col brand Depureco) */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:#f5f5f5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.app-hide{display:none!important}

/* ── top bar ── */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;
  padding:10px 22px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar svg{display:block}
.topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.3px}
.topbar .spacer{flex:1}
.lang-wrap,.list-wrap{display:flex;align-items:center;gap:6px;font-size:12px}
.lang-wrap select,.list-wrap select{background:var(--navy2);color:#fff;border:1px solid #4a4a4a;
  border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600}
.list-wrap select{min-width:60px}

/* ── stepper ── */
.stepper{display:flex;gap:6px;background:#fff;padding:12px 22px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;position:sticky;top:54px;z-index:40}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:30px;font-size:13px;
  font-weight:600;color:var(--muted);background:var(--soft);border:1px solid transparent}
.step .n{width:22px;height:22px;border-radius:50%;background:#cfcfcf;color:#fff;display:grid;
  place-items:center;font-size:12px;font-weight:700}
.step.active{color:var(--navy);background:#f6e6e5;border-color:#dbb4b3}
.step.active .n{background:var(--red)}
.step.done .n{background:var(--navy)}
.step.clickable{cursor:pointer}

/* ── layout ── */
.wrap{max-width:1080px;margin:0 auto;padding:26px 22px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.card .hint{margin:0 0 18px;color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:720px){.g2,.g3{grid-template-columns:1fr}}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#4a4a4a}
label.fld input,label.fld select,label.fld textarea{padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;font-weight:400;color:var(--ink);background:#fff}
label.fld input:focus,label.fld textarea:focus,label.fld select:focus{outline:none;border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(23,23,23,.08)}
textarea{resize:vertical;min-height:80px}

/* ── nav buttons ── */
.navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px;padding:12px 22px;z-index:45}
.navbar .inner{max-width:1080px;margin:0 auto;width:100%;display:flex;justify-content:space-between;gap:12px}
.btn{padding:11px 22px;border-radius:9px;border:none;font-size:14px;font-weight:700}
.btn.prim{background:var(--red);color:#fff}
.btn.prim:hover{background:#8c1412}
.btn.ghost{background:var(--soft);color:var(--navy)}
.btn.ghost:hover{background:#e4e4e4}
.btn.nav{background:var(--navy);color:#fff}
.btn.nav:hover{background:#292929}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 13px;font-size:12.5px}

/* ── product browser ── */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;background:#fff;
  transition:.12s}
.cat:hover{border-color:var(--navy);box-shadow:0 4px 14px rgba(23,23,23,.1)}
.cat.sel{border-color:var(--red);background:#fff5f4}
.cat .ttl{font-weight:800;color:var(--navy);font-size:15px}
.cat .cnt{font-size:11.5px;color:var(--muted);margin-top:3px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin:14px 0}
.mlist{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:4px}
.mrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:11px 14px}
.mrow:hover{border-color:var(--navy)}
.mrow .info{flex:1;min-width:0}
.mrow .nm{font-weight:700;color:var(--navy);font-size:14px}
.mrow .meta{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .pr{font-weight:800;color:var(--ink);font-size:14px;white-space:nowrap}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;
  padding:2px 7px;border-radius:20px;letter-spacing:.4px;vertical-align:middle}
.badge.code{background:var(--soft);color:var(--navy);font-weight:700}

/* ── solutions ── */
.sol{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px;background:#fbfbfb}
.sol .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sol .head .nm{font-weight:800;color:var(--navy);font-size:16px}
.sol .head .cd{font-size:12px;color:var(--muted)}
.acc-row{display:grid;grid-template-columns:1.4fr 2.6fr .7fr 1fr .8fr auto;gap:8px;margin-top:8px;align-items:center}
.mvbtns{display:inline-flex;gap:4px}
.mvbtns .xbtn{background:var(--steel);font-size:10px}
.mvbtns .xbtn:disabled{opacity:.3;cursor:default}
.optgrp{margin:6px 0 8px}
.optgrp-t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--steel);display:inline-block;padding:2px 9px;border-radius:4px;margin-bottom:5px}
.optchips{display:flex;flex-wrap:wrap;gap:6px}
.chip.opt{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;max-width:260px;padding:6px 10px;line-height:1.25}
.chip.opt .oc{font-weight:800}.chip.opt .od{font-size:10.5px;color:#6f6f6f;font-weight:400;white-space:normal}.chip.opt .op{font-size:11px;color:var(--navy);font-weight:700}
.chip.opt.chk{border-color:#d97706;background:#fff8ec}
.acc-head{font-size:10.5px;font-weight:700;color:#6f6f6f;text-transform:uppercase;letter-spacing:.3px;margin-top:8px;padding-left:48px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;color:#6f6f6f;text-transform:uppercase;letter-spacing:.3px}
.acc-row input{padding:8px 10px;border:1px solid var(--line);border-radius:7px}
@media(max-width:720px){.acc-row{grid-template-columns:1fr 1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;background:#efefef;color:var(--navy);
  border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;margin:3px 4px 0 0}
.chip button{border:none;background:none;color:var(--red);font-weight:800;font-size:14px;line-height:1}
.xbtn{border:none;background:#fde9e7;color:var(--red);border-radius:7px;width:30px;height:30px;font-weight:800;z-index:5;cursor:pointer}
.addbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.imgthumb{width:62px;height:62px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.drawer{position:fixed;top:118px;right:0;width:286px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-right:none;border-radius:12px 0 0 12px;box-shadow:-8px 0 24px rgba(23,23,23,.12);z-index:40;transition:transform .22s ease}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy);font-size:13px;position:sticky;top:0;background:#fff}
.drawer .dbody{padding:8px 12px 14px}
.drawer .ditem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f2f5}
.drawer .ditem .nm{font-size:12px;font-weight:700;color:#1f1f1f;line-height:1.25}
.drawer .ditem .cd{font-size:10.5px;color:#6f6f6f}
.drawer.closed{transform:translateX(calc(100% - 40px))}
.drawer .dtab{position:absolute;left:-1px;top:0;height:100%;width:40px;display:none;align-items:center;justify-content:center;cursor:pointer;background:var(--red);color:#fff;border-radius:12px 0 0 12px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:11.5px}
.drawer.closed .dtab{display:flex}
.drawer.closed .dhead,.drawer.closed .dbody{visibility:hidden}
@media print{.drawer{display:none!important}}

/* ── preview / offer document ── */

.doc-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fileinfo{font-size:12px;color:var(--muted)}
.pages{background:#5c5c5c;padding:22px;border-radius:12px}
.page{width:210mm;min-height:297mm;background:#fff;margin:0 auto 18px;position:relative;
  padding:0;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:11.5px;color:#222}
.page .pad{padding:16mm 15mm 26mm}
/* footer band with curved white notch on the right + red web address */
.page .foot{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--navy);
  color:#d0d0d0;font-size:7.2px;line-height:1.5;display:flex;align-items:center;
  justify-content:space-between;padding:0 15mm}
.page .foot b{color:#fff}
.page .foot .web{color:var(--yellow);font-weight:800;font-size:9px;position:relative;z-index:3;margin-right:18px}
.page .foot .notch{position:absolute;right:0;bottom:0;width:110px;height:46px;
  background:#fff;border-top-left-radius:46px;z-index:1}
.plogo{margin-bottom:12mm}

/* cover */
.cover{background:var(--navy);color:#fff}
.cover .clogo{position:absolute;top:18%;left:0;right:0;text-align:center}
.cover .clogo svg{margin:0 auto}
.cover .ctitle{position:absolute;top:50%;left:0;right:0;text-align:center;font-size:19px;
  font-weight:300;letter-spacing:1.5px}
.cover .ctitle .nm{margin-top:10px;font-size:17px;letter-spacing:2px}
.cover .symbol{position:absolute;left:-40px;right:auto;bottom:-30px;width:430px;height:430px;z-index:0;opacity:.82;transform:scaleX(-1)}
.cover .contact{position:absolute;right:48px;bottom:150px;color:#fff;font-size:10.5px;
  line-height:1.9;z-index:3;text-align:left;text-shadow:0 1px 3px rgba(8,14,28,.85)}
.cover .contact b{display:block;font-size:10.5px;font-weight:800;letter-spacing:1px;margin-bottom:5px}
.cover .contact a{color:#FFD017;text-decoration:none}

/* generic two-column section header bar (steel-blue + grey) */
.hbar{display:grid;grid-template-columns:33% 1fr;gap:8px;margin:7mm 0 5mm}
.hbar .l{background:var(--steel);color:#fff;padding:9px 14px;font-size:11.5px;font-weight:500;
  letter-spacing:.3px}
.hbar .r{background:var(--greybar);color:var(--navy);padding:9px 14px;font-size:13px;font-weight:800;
  display:flex;align-items:center}

/* letter page */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:8mm 0 9mm}
.info-l .ir{background:var(--steel);color:#fff;padding:9px 13px;font-size:11px;margin-bottom:6px}
.info-l .ir b{color:#fff;font-weight:600}
.info-l .ir .v{color:#cdd6e2;font-weight:400}
.info-r{border:1px dashed #bdbdbd;padding:16px 18px;font-size:11px;line-height:2.15}
.info-r .nm{font-weight:800;color:var(--navy);font-size:12px;margin-bottom:6px}
.info-r b{color:#5a5a5a;font-weight:600}
.info-r .v{color:#8f8f8f}
.subj-bar{background:var(--steel);color:#fff;padding:10px 14px;font-weight:600;font-size:12px;margin-bottom:9px}
.date-bar{display:inline-block;background:var(--steel);color:#fff;padding:8px 18px;font-weight:600;
  font-size:12px;margin-bottom:16px}
.letter-box{border:1px solid var(--line);padding:20px 22px;line-height:2.4;font-size:11.5px;min-height:55mm}
.sign{text-align:center;margin:30px 0 0;margin-right:8mm;line-height:2;font-size:11.5px;
  display:flex;flex-direction:column;align-items:flex-end}
.sign span{display:block;text-align:center;min-width:160px}

/* solution page */
.prod-grid{display:grid;grid-template-columns:185px 1fr;gap:18px;align-items:start;margin-top:2mm}
.prod-img{width:185px;height:225px;object-fit:contain;border:1px solid var(--line);background:#fff}
.prod-img.empty{display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center;padding:10px}
.prod-ttl{font-weight:700;font-size:12.5px}
.prod-ttl b{font-weight:800}
.prod-sub{font-size:12px;margin:3px 0 4px}
.atexrow{display:flex;align-items:flex-start;gap:14px;justify-content:space-between}
.atexrow .marks{display:flex;gap:5px;flex-shrink:0;margin-top:2px}
.atexbadge{border:1px solid #bdbdbd;border-radius:2px;padding:3px 5px;font-size:7px;font-weight:800;
  color:var(--navy);text-align:center;line-height:1.2;background:#fff;min-width:26px}
.atexbadge.ex{color:var(--red);border-color:var(--red)}
.prod-grid ul{margin:8px 0 0;padding-left:16px;line-height:1.75;font-size:11.3px}
.mark{color:var(--red);font-weight:700}
.acc-bar{display:grid;grid-template-columns:33% 1fr;gap:8px;margin:6mm 0}
.acc-bar .l{background:var(--steel);color:#fff;padding:14px;font-size:11.5px;display:grid;
  place-items:center;text-align:center;letter-spacing:.3px}
.acc-bar .r{background:var(--greybar);padding:13px 15px;font-size:10.5px;line-height:1.6;color:#2b2b2b}
.acc-bar .r .kit{font-weight:800;color:var(--navy)}
.ptable{width:100%;border-collapse:collapse;margin-top:4px;font-size:11px}
.ptable th{background:var(--steel);color:#e6e6e6;padding:9px 12px;text-align:left;font-weight:500;font-size:10.5px}
.ptable th.r,.ptable td.r{text-align:right}
.ptable th.c,.ptable td.c{text-align:center}
.ptable td{padding:8px 12px;border-bottom:1px solid #e5e5e5;color:#2b2b2b}
.ptable td.pdesc{font-size:10px;color:#555555;max-width:230px;line-height:1.35}
.ptable td.pimg{width:44px;padding:4px 6px}
.ptable td.pimg img{width:38px;height:38px;object-fit:contain;display:block}
.addimg{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px dashed #dbb4b3;border-radius:6px;font-size:10px;color:#7a7a7a;cursor:pointer;background:#f7f7f7;text-align:center;line-height:1.1}
.addimg:hover{background:#f3f3f3;border-color:var(--navy)}
.pe{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.ce{cursor:text;border-radius:2px}
.ce:hover{background:#f2f6fd}
.ce:focus{outline:2px solid var(--red);background:#fff;padding:0 2px}
.ce:empty::before{content:'…';color:#b0b8c6}
@media print{.ce{outline:none!important;background:none!important;padding:0}.ce:empty::before{content:''}}
body.exporting .ce{outline:none!important;background:none!important;padding:0}
body.exporting .ce:empty::before{content:''}
body.exporting .specdel{display:none!important}
body.exporting .app-noprint{display:none!important}
.prodedit summary{list-style:none}.prodedit summary::-webkit-details-marker{display:none}
.specdel{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:50%;background:#e8ecf2;color:#8592a8;font-size:11px;line-height:1;cursor:pointer;vertical-align:middle}
.specdel:hover{background:var(--red);color:#fff}

.totbar{background:var(--steelL);color:#fff;display:flex;justify-content:space-between;
  padding:11px 14px;font-weight:800;font-size:13px;margin-top:0}
.totblock .totline{display:flex;justify-content:space-between;padding:7px 14px;font-size:11.5px;color:#2b2b2b;border-bottom:1px solid #e5e5e5}
.totbar.pkg{background:var(--navy);margin-top:6px}

/* supply / general */
.supply{width:100%;border-collapse:collapse;font-size:11px;margin-top:2mm}
.supply td{border:1px solid var(--line);padding:9px 13px}
.supply td:first-child{width:38%;color:#6f6f6f;text-transform:uppercase;font-size:10px;letter-spacing:.4px}
.excl-box{border:1px solid var(--line);padding:6px 8px;margin-top:1mm}
.excl-box ul{margin:6px 0;padding-left:22px;line-height:1.9}
.gc{font-size:9px;line-height:1.6;color:#333;text-align:justify;margin-top:3mm}
.gc p{margin:0 0 6px}
.gc b{color:#222}
.gc-title{font-weight:800;color:var(--navy);font-size:12px;margin:1mm 0 3mm}
.gc-terms{font-size:8px;line-height:1.5;color:#333;text-align:justify;columns:2;column-gap:7mm}
.gc-terms .gc-c{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:7px}
.gc-terms .gc-h{display:block;font-weight:800;color:var(--navy);font-size:8.5px;margin-bottom:2px}
.gc-terms p{margin:0 0 2px}
.gc-note{font-style:italic;color:#555;font-size:7.2px;margin-top:5px!important}
.gc-sign-label{margin-top:10px!important;font-weight:700;color:var(--navy)}
.gc-sign-line{border-bottom:1px solid #a0a0a0;width:75%;height:1px;margin:16px 0 2px}
/* terms page: grow with content and keep the footer in normal flow so 2-column text never hides under the navy bar */
.page.terms{height:auto;min-height:297mm}
.page.terms .pad{padding-bottom:12mm}
.page.terms .foot{position:static;left:auto;right:auto;bottom:auto;height:auto;min-height:40px;margin:10mm -15mm 0;padding:9px 15mm;border-radius:0}
.page.terms .foot .notch{display:none}
.page.terms .gc-terms{font-size:7.7px;line-height:1.45}

*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .topbar,.stepper,.navbar,.doc-tools,.app-noprint,#xlsxBtn,#imgBtn,#cliBtn,#regBtn,#flash{display:none!important}
  .wrap{padding:0;max-width:none}
  .pages{background:#fff;padding:0}
  .page{box-shadow:none;margin:0;page-break-after:always;width:210mm;height:297mm;min-height:297mm;overflow:hidden}
  .page.terms{height:auto!important;min-height:0!important;overflow:visible!important}
  .page:last-child{page-break-after:auto}
  .card{border:none;padding:0;margin:0}
}
.load-overlay{position:fixed;inset:0;background:rgba(23,23,23,.55);display:none;align-items:center;justify-content:center;z-index:9999}
.load-card{background:#fff;border-radius:14px;padding:24px 26px;width:min(430px,90vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.load-title{font-weight:800;color:var(--navy);font-size:16px;margin-bottom:4px}
.load-status{font-size:12.5px;color:#555555;margin-bottom:12px;min-height:16px}
.load-track{height:12px;background:#e6e9ef;border-radius:8px;overflow:hidden;position:relative}
.load-fill{height:100%;width:0;background:linear-gradient(90deg,var(--navy),#AA1917);border-radius:8px;transition:width .12s ease}
.load-fill.indet{width:38%!important;position:absolute;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{left:-40%}100%{left:100%}}
.load-pct{text-align:right;font-size:12px;color:#4a4a4a;margin-top:6px;font-weight:700;min-height:15px}
@media print{.load-overlay{display:none!important}}
</style>

<script>
/* Dati di avvio. Le macchine arrivano da js/data/catalogo.js (generato da tools/build_catalog_js.py). */
const EMBEDDED = {
  machines: (typeof CATALOGO_DEPURECO!=='undefined') ? CATALOGO_DEPURECO : [],
  accessories: [],
  reps: [{name:"Ufficio Commerciale Depureco",email:"depureco@depureco.com",phone:"+39 011 9859117",role:"Sales"}]
};
const MACHINE_OPTIONALS = {};  // codice macchina -> [{code,desc,l0,le}] optional selezionabili (sovrapprezzo)
const MACHINE_SPARES    = {};  // codice macchina -> [{code,desc,l0,le}] ricambi
const EMBEDDED_CLIENTS = [];

<!-- applicazione (ordine rilevante: condividono lo scope globale) -->
<script>
/* Generatore Offerte Depureco — modulo "core" */
let LANG='it';   // listino prezzi unico (Depureco non ha L0/LE)
function t(k){return (I18N[LANG]&&I18N[LANG][k])||(I18N.en[k])||k;}

/* ============== STATE ============== */
let DATA = JSON.parse(JSON.stringify(EMBEDDED));
let loadedFromFile=false, loadedFileName='';
const yr=new Date().getFullYear();
let step=0;
const S={
  rep:DATA.reps[0]||{name:'',email:'',phone:''},
  offerNum:BRAND.offerPrefix+String(yr).slice(2)+'-001',
  date:new Date().toLocaleDateString('it-IT'),
  client:'', contact:'', role:'', phone:'', email:'', subject:t('def_subject'),
  isRevisionOffer:false,
  intro:'',
  app:{duty:'',risk:'',zone:'',install:'',airflow:'',waterlift:'',points:'',temp:'',humidity:'',emission:'',dust:''},
  solutions:[], // {code,name,desc,atex,unit,qty,img,specs:{}, accessories:[{code,desc,qty,price}]}
  discount:40, discount2:0, discount3:0,
  validity:'60', lead:'4', delivery:'', packaging:'', warranty:'24', payment:'',
  exclusions:'', notes:''
};
const STEPS=['customer','application','product','options','quote'];

/* ============== EXTERNAL RESOURCES (images, clients, registry) ============== */
let IMGMAP={};        // normalizedCode -> File (loaded eagerly at folder-link time)
let IMGCACHE={};      // normalizedCode -> object URL (lazy, fast)
let CLIENTS=(EMBEDDED_CLIENTS||[]).slice();   // auto-loaded from embedded list (zero-click)
let REGISTRY={rows:[], fileHandle:null, fileName:''};
let CLIENTS_FILE={handle:null, name:''};   // writable handle to the source contacts file (when folder linked)
function imgKey(code){return String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function imgUrlForCode(code){
  const k=imgKey(code);
  if(IMGCACHE[k])return IMGCACHE[k];
  const f=IMGMAP[k];if(!f)return '';
  const url=URL.createObjectURL(f);   // instant, no base64 decode
  IMGCACHE[k]=url;return url;
}
// per-solution image gallery: keep s.imgs[] and mirror the primary into s.img (used by document/word/drawer)
function ensureImgs(s){ if(!Array.isArray(s.imgs)) s.imgs = s.img ? [s.img] : []; s.img = s.imgs[0]||''; return s.imgs; }
function addSolImages(si, urls){ const s=S.solutions[si]; ensureImgs(s); urls.forEach(u=>{if(u)s.imgs.push(u);}); s.img=s.imgs[0]||''; }
// optionals & spare parts read from the price lists, specific to each model
function machineOptionals(code){return MACHINE_OPTIONALS[code]||[];}
function machineSpares(code){return MACHINE_SPARES[code]||[];}
function liteP(o){return o.price??o.l0??o.le;}
function addItem(si,o){
  if(S.solutions[si].accessories.find(x=>x.code===o.code))return;
  const item={code:o.code,desc:o.desc||'',qty:1,price:liteP(o)||0,img:''};
  S.solutions[si].accessories.push(item);
  const u=imgUrlForCode(o.code);if(u)item.img=u;
  stepOptions();
}
function nextProgressivo(){
  let max=0;REGISTRY.rows.forEach(r=>{const p=parseInt(r.prog||r.Progressivo||0,10);if(p>max)max=p;});
  return max+1;
}
function applyNextOfferNumber(){
  // never clobber a recalled offer's "<original>_REVn" number with a fresh progressive one —
  // this refresh runs automatically (e.g. every time the Offer step renders) so without this
  // guard a revision number gets silently overwritten before the user even hits Save
  if(S.isRevisionOffer||/_REV\d+$/i.test(String(S.offerNum||'')))return;
  const n=nextProgressivo();
  S.offerNum=BRAND.offerPrefix+String(yr).slice(2)+'-'+String(n).padStart(3,'0');
}

/* ============== HELPERS ============== */
const $=s=>document.querySelector(s);
const ce=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
function money(n){n=Number(n)||0;const neg=n<0;n=Math.abs(n);const p=n.toFixed(2).split('.');const int=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+int+','+p[1]+' €';}
function priceOf(m){return Number(m.price)||0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const SPEC_FIELDS=[['power','power'],['voltage','voltage'],['vacuum','vacuum'],['airflow','airflow'],
  ['noise','noise'],['filter_type','filter_type'],['filter_surface','filter_surface'],
  ['capacity','capacity'],['suction','suction'],['dimensions','dimensions'],['weight','weight']];
// default units auto-appended for CUSTOM machines when the user types only a number
const SPEC_UNITS={power:'kW',voltage:'V',vacuum:'mbar',airflow:'m³/h',noise:'dB(A)',filter_surface:'cm²',capacity:'lt',suction:'mm',dimensions:'cm',weight:'kg'};
function withUnit(k,v,custom){v=String(v==null?'':v).trim();if(!v)return v;if(!custom||!SPEC_UNITS[k])return v;const chk=k==='dimensions'?v.replace(/[xh]/gi,''):v;return /[a-zA-Z]/.test(chk)?v:v+' '+SPEC_UNITS[k];}
function unitFor(k,v,custom){v=String(v==null?'':v).trim();if(!v||!custom||!SPEC_UNITS[k])return '';const chk=k==='dimensions'?v.replace(/[xh]/gi,''):v;return /[a-zA-Z]/.test(chk)?'':SPEC_UNITS[k];}
</script>
<script>
/* Generatore Offerte Depureco — modulo "steps-customer-application" */
/* ============== RENDER STEPPER ============== */
function renderStepper(){
  const sp=$('#stepper');sp.innerHTML='';
  STEPS.forEach((s,i)=>{
    const d=ce('div','step'+(i===step?' active':'')+(i<step?' done':'')+(i<=maxReached?' clickable':''));
    d.innerHTML=`<span class="n">${i<step?'✓':i+1}</span>${t('step_'+s)}`;
    if(i<=maxReached)d.onclick=()=>{step=i;render();};
    sp.appendChild(d);
  });
}
let maxReached=0;

/* ============== STEP 1: CUSTOMER ============== */
function stepCustomer(){
  const v=$('#view');
  const repOpts=DATA.reps.map(r=>`<option value="${esc(r.email)}"${r.email===S.rep.email?' selected':''}>${esc(r.name)}</option>`).join('');
  v.innerHTML=`
  <div class="card">
    <h2>${t('step_customer')}</h2><p class="hint">${t('hint_customer')}</p>
    ${window.showDirectoryPicker?`<button class="btn ghost" id="btnRecall" style="margin-bottom:12px">🔄 ${t('recall_offer')}</button>`:''}
    <button class="btn ghost" id="btnRecallUpload" style="margin-bottom:12px">📤 ${t('recall_upload')}</button>
    <div class="grid g3">
      <label class="fld">${t('f_rep')}<select id="i_rep">${repOpts}</select></label>
      <label class="fld">${t('f_repmail')}<input id="i_repmail" value="${esc(S.rep.email)}" readonly></label>
      <label class="fld">${t('f_repphone')}<input id="i_repphone" value="${esc(S.rep.phone)}" readonly></label>
    </div>
    <div class="grid g3" style="margin-top:14px">
      <label class="fld">${t('f_offernum')}<input id="i_offernum" value="${esc(S.offerNum)}"></label>
      <label class="fld">${t('f_date')}<input id="i_date" value="${esc(S.date)}"></label>
      <label class="fld">${t('f_subject')}<input id="i_subject" value="${esc(S.subject)}" placeholder="${esc(t('ph_subject'))}"></label>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <label class="fld" style="position:relative">${t('f_client')} ${CLIENTS.length?'<span style="color:var(--muted);font-weight:400">· '+CLIENTS.length+' '+t('clients')+'</span>':''}
        <input id="i_client" value="${esc(S.client)}" autocomplete="off" placeholder="${CLIENTS.length?esc(t('ph_client_search')):''}">
        <div id="cliSugg" style="position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:20;max-height:230px;overflow:auto;display:none"></div>
      </label>
      <label class="fld">${t('f_contact')}<input id="i_contact" value="${esc(S.contact)}"></label>
      <label class="fld">${t('f_role')}<input id="i_role" value="${esc(S.role)}"></label>
      <label class="fld">${t('f_cphone')}<input id="i_phone" value="${esc(S.phone)}"></label>
      <label class="fld">${t('f_cemail')}<input id="i_email" value="${esc(S.email)}"></label>
    </div>
    <label class="fld" style="margin-top:14px">${t('f_intro')}
      <textarea id="i_intro" placeholder="${esc(t('intro_default'))}">${esc(S.intro)}</textarea></label>
  </div>`;
  $('#i_rep').onchange=e=>{const r=DATA.reps.find(x=>x.email===e.target.value);if(r){S.rep=r;$('#i_repmail').value=r.email;$('#i_repphone').value=r.phone;}};
  if($('#btnRecall'))$('#btnRecall').onclick=recallOffer;
  if($('#btnRecallUpload'))$('#btnRecallUpload').onclick=openRecallUploadModal;
  const bind=(id,key)=>{$('#'+id).oninput=e=>S[key]=e.target.value;};
  bind('i_offernum','offerNum');bind('i_date','date');bind('i_subject','subject');
  bind('i_contact','contact');bind('i_role','role');
  bind('i_phone','phone');bind('i_email','email');bind('i_intro','intro');
  // client field with autocomplete from loaded clients file
  const ci=$('#i_client'), sg=$('#cliSugg');
  function showSugg(){
    if(!CLIENTS.length){sg.style.display='none';return;}
    const q=ci.value.trim().toLowerCase();
    let list=CLIENTS;
    if(q)list=CLIENTS.filter(c=>(c.company+' '+c.contact+' '+c.email).toLowerCase().includes(q));
    list=list.slice(0,40);
    if(!list.length){sg.style.display='none';return;}
    sg.innerHTML=list.map((c,i)=>`<div data-ci="${CLIENTS.indexOf(c)}" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f2f5;font-size:13px">
      <b>${esc(c.company)}</b>${c.contact?' · '+esc(c.contact):''}${c.email?'<br><span style="color:#6f6f6f;font-size:11.5px">'+esc(c.email)+'</span>':''}</div>`).join('');
    sg.style.display='block';
    sg.querySelectorAll('[data-ci]').forEach(d=>{
      d.onmousedown=ev=>{ev.preventDefault();const c=CLIENTS[+d.dataset.ci];
        S.client=c.company;S.contact=c.contact||S.contact;S.role=c.role||S.role;
        S.email=c.email||S.email;S.phone=c.phone||S.phone;
        sg.style.display='none';render();};
    });
  }
  ci.oninput=e=>{S.client=e.target.value;showSugg();};
  ci.onfocus=showSugg;
  ci.onblur=()=>setTimeout(()=>{if(sg)sg.style.display='none';},150);
}

const APP_KEYS=['duty','risk','zone','install','airflow','waterlift','points','temp','humidity','emission','dust'];
/* ============== STEP 2: APPLICATION ============== */
function stepApplication(){
  const v=$('#view');
  // offers recalled from older files may lack some application fields: make sure all exist
  S.app=Object.assign({duty:'',risk:'',zone:'',install:'',airflow:'',waterlift:'',points:'',temp:'',humidity:'',emission:'',dust:''},S.app||{});
  const f=(k,ph)=>`<label class="fld">${t('a_'+k)}<input id="a_${k}" value="${esc(S.app[k])}" placeholder="${esc(ph||'')}"></label>`;

function addSolution(code){

<script>
/* Generatore Offerte Depureco — modulo "step-options" */
const OPT_GROUP_ORDER=['Filtrazione','Struttura','Costruzione','Pulizia filtro','Accessori','Altro'];
let OPT_CATALOG={};      // optional code -> {group,order,desc}
let MATRIX_INFO={file:'',machines:0};
function optGroupSlug(g){return String(g||'Altro').toLowerCase().replace(/[^a-z]+/g,'_').replace(/^_|_$/g,'');}
function optGroupLabel(g){const k='og_'+optGroupSlug(g);const v=t(k);return v===k?g:v;}
// one price sheet: row "Codice Macchina" = optional codes, next row "Descrizione", then one row per machine (blank cell = not available)
function parseMatrixSheet(sheet){
  const aoa=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
  const hi=aoa.findIndex(r=>norm(r[0]).toLowerCase()==='codice macchina');if(hi<0)return null;
  const codes=aoa[hi].map(norm);
  const grpRow=(hi>0&&norm(aoa[hi-1][0]).toLowerCase()==='gruppo')?aoa[hi-1].map(norm):[];
  const di=(aoa[hi+1]&&norm(aoa[hi+1][0]).toLowerCase()==='descrizione')?hi+1:-1;
  const descs=di>=0?aoa[di].map(norm):[];
  const rows={};
  for(let i=(di>=0?di:hi)+1;i<aoa.length;i++){
    const r=aoa[i];const m=norm(r[0]);if(!m)continue;
    const o={};
    for(let j=1;j<codes.length;j++){if(!codes[j])continue;const v=r[j];if(v===''||v==null)continue;o[codes[j]]=num(v);}
    rows[m]=o;
  }
  return {codes,descs,grpRow,rows};
}
function applyMatrixWorkbook(wb,fileName){
  const find=k=>wb.SheetNames.find(n=>n.toLowerCase().includes(k));
  const s0=find('optional_l0')||find('l0'),sE=find('optional_le')||find('_le');
  const p0=s0?parseMatrixSheet(wb.Sheets[s0]):null,pE=sE?parseMatrixSheet(wb.Sheets[sE]):null;
  if(!p0&&!pE)return false;
  // catalogue (group / order / description per optional) + prices still to verify
  OPT_CATALOG={};
  const sC=find('catalogo');
  if(sC)sheetRows(wb.Sheets[sC],['codice']).forEach(r=>{const c=norm(r.Codice);if(c)OPT_CATALOG[c]={group:norm(r.Gruppo),order:num(r.Ordine),desc:norm(r.Descrizione)};});
  const CHECK=new Set();
  const sV=find('verific');
  if(sV)sheetRows(wb.Sheets[sV],['macchina']).forEach(r=>{const m=norm(r.Macchina),o=norm(r.Optional);if(m&&o)CHECK.add(m+'|'+o);});
  const hdrInfo={};
  [p0,pE].forEach(p=>{if(!p)return;p.codes.forEach((c,j)=>{if(!c||j===0)return;hdrInfo[c]=hdrInfo[c]||{};if(p.descs[j]&&!hdrInfo[c].desc)hdrInfo[c].desc=p.descs[j];if(p.grpRow[j]&&!hdrInfo[c].group)hdrInfo[c].group=p.grpRow[j];});});
  const gOf=c=>{const g=(OPT_CATALOG[c]&&OPT_CATALOG[c].group)||(hdrInfo[c]&&hdrInfo[c].group)||'Altro';
    const hit=OPT_GROUP_ORDER.find(x=>x.toLowerCase()===g.toLowerCase());return hit||'Altro';};
  Object.keys(MACHINE_OPTIONALS).forEach(k=>delete MACHINE_OPTIONALS[k]);
  const machines=new Set([...Object.keys(p0?p0.rows:{}),...Object.keys(pE?pE.rows:{})]);
  machines.forEach(m=>{
    const a0=(p0&&p0.rows[m])||{},aE=(pE&&pE.rows[m])||{};
    const list=[...new Set([...Object.keys(a0),...Object.keys(aE)])].map(c=>({
      code:c,desc:(OPT_CATALOG[c]&&OPT_CATALOG[c].desc)||(hdrInfo[c]&&hdrInfo[c].desc)||'',
      l0:a0[c],le:aE[c],group:gOf(c),order:(OPT_CATALOG[c]&&OPT_CATALOG[c].order)||9999,check:CHECK.has(m+'|'+c)}));
    list.sort((x,y)=>OPT_GROUP_ORDER.indexOf(x.group)-OPT_GROUP_ORDER.indexOf(y.group)||x.order-y.order||x.code.localeCompare(y.code));
    MACHINE_OPTIONALS[m]=list;
  });
  MATRIX_INFO={file:fileName,machines:machines.size};
  return true;
}
function handleMatrix(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      if(!applyMatrixWorkbook(wb,file.name)){flash(t('matrix_err'));return;}
      if($('#matTxt'))$('#matTxt').textContent='âœ“ '+file.name;
      flash(t('matrix_ok').replace('%n',MATRIX_INFO.machines));
      if(step===3)render();
    }catch(err){console.error(err);flash(t('matrix_err'));}
  };
  reader.readAsArrayBuffer(file);
}

function discMultiplier(){return (1-(S.discount||0)/100)*(1-(S.discount2||0)/100)*(1-(S.discount3||0)/100);}
function discLabel(){const parts=[S.discount||0];if(S.discount2)parts.push(S.discount2);if(S.discount3)parts.push(S.discount3);return parts.join('+');}
// Discount per item: the machine and each accessory can carry its own discount % (item.disc).
// When left empty the general cascading discount (step Options, commercial terms) applies.
function itemMult(d){return (d==null||d==='')?discMultiplier():(1-(Number(d)||0)/100);}
function itemDiscLabel(d){return (d==null||d==='')?discLabel():String(Number(d)||0);}
// Machines: by default each one is an ALTERNATIVE solution (customer picks one). A machine flagged
// sameOrder (S.solutions[i].sameOrder, i>0) belongs to the SAME ORDER as the previous one: they are
// quoted together and their totals add up. Consecutive machines linked this way form one "package".
function lineTotals(){
  const mult=discMultiplier();
  const sols=S.solutions.map(s=>{
    const rows=[];
    const mk=(o,d)=>{o.disc=itemDiscLabel(d);o.total=o.partial*itemMult(d);return o;};
    if(!s.sparesOnly)rows.push(mk({code:s.code,desc:s.tableDesc||s.name,unit:s.unit,qty:s.qty,partial:s.unit*s.qty,img:s.img},s.disc));
    s.accessories.forEach(a=>{
      rows.push(mk({code:a.code||a.desc,desc:a.desc||'',unit:a.price,qty:a.qty,partial:a.price*a.qty,img:a.img},a.disc));});
    const listTot=rows.reduce((x,r)=>x+r.partial,0);
    return {s,rows,listTot,solTot:rows.reduce((x,r)=>x+r.total,0)};
  });
  const packages=[];
  sols.forEach((sd,i)=>{
    if(i>0&&sd.s.sameOrder)packages[packages.length-1].members.push(i);
    else packages.push({members:[i]});
  });
  packages.forEach((p,pi)=>{
    p.listTot=p.members.reduce((x,i)=>x+sols[i].listTot,0);
    p.net=p.members.reduce((x,i)=>x+sols[i].solTot,0);
    p.members.forEach((i,k)=>{sols[i].pkg=pi+1;sols[i].pos=k+1;sols[i].pkgSize=p.members.length;});
  });
  // registry total: with a single package it is the whole offer; with alternatives it is the first one
  const grand=packages.length?packages[0].net:0;
  return {sols,packages,grand,mult};
}

// Price tables: when a machine page is taller than an A4 sheet, move the last rows (and the totals
// that follow the table) onto a continuation page, repeating logo, title bar and table header.
function repaginateQuote(){
  const A4H=297*96/25.4;
  const queue=[...document.querySelectorAll('#view .pages > .page')].filter(p=>p.querySelector(':scope > .pad > table.ptable'));
  while(queue.length){
    const p=queue.shift();
    const pad=p.querySelector(':scope > .pad'),foot=pad.querySelector(':scope > .foot'),table=pad.querySelector(':scope > table.ptable');
    if(!foot||!table)continue;
    // content must end where the page's bottom padding starts, so the sheet never grows beyond A4
    const limit=A4H-(parseFloat(getComputedStyle(pad).paddingBottom)||98);
    const bottomOf=()=>{const top=p.getBoundingClientRect().top;let m=0;[...pad.children].forEach(e=>{if(e!==foot)m=Math.max(m,e.getBoundingClientRect().bottom-top);});return m;};
    const rowsOf=()=>[...table.querySelectorAll('tr')].filter(r=>!r.querySelector('th'));
    let cont=null,guard=0;
    while(bottomOf()>limit&&rowsOf().length>1&&guard++<400){
      if(!cont){
        cont=document.createElement('div');cont.className=p.className;
        const cpad=document.createElement('div');cpad.className='pad';
        const logo=pad.querySelector(':scope > .plogo'),bar=pad.querySelector(':scope > .hbar');
        if(logo)cpad.appendChild(logo.cloneNode(true));
        if(bar)cpad.appendChild(bar.cloneNode(true));
        const ct=table.cloneNode(false);const head=table.querySelector('tr');if(head)ct.appendChild(head.cloneNode(true));
        cpad.appendChild(ct);
        // everything after the table (totals, order total) travels with the last rows
        let n=table.nextElementSibling;const tail=[];
        while(n&&n!==foot){tail.push(n);n=n.nextElementSibling;}
        tail.forEach(e=>cpad.appendChild(e));
        cpad.appendChild(foot.cloneNode(true));
        cont.appendChild(cpad);p.after(cont);
      }
      const ct=cont.querySelector('table.ptable');
      const last=rowsOf().pop();
      const firstMoved=ct.querySelectorAll('tr')[1];
      ct.insertBefore(last,firstMoved||null);
    }
    if(cont)queue.unshift(cont);
  }
}

<script>
/* Generatore Offerte Depureco — modulo "persistence" */

function mkLoaderBtn(id,label,attrs){

function setupLoader(){

function handleImages(e){
  const files=[...e.target.files].filter(f=>/\.(png|jpe?g|webp|gif)$/i.test(f.name));
  Object.values(IMGCACHE).forEach(u=>{try{URL.revokeObjectURL(u);}catch(_){}});
  IMGMAP={};IMGCACHE={};

  S.solutions.forEach(s=>{if(!s.img){const u=imgUrlForCode(s.code);if(u){s.img=u;ensureImgs(s);if(!s.imgs.length)s.imgs.push(u);}}});
  S.solutions.forEach(s=>s.accessories.forEach(a=>{if(!a.img){const u=imgUrlForCode(a.code);if(u)a.img=u;}}));

function handleClients(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=sheetRows(sheet,['azienda','company','ragione sociale','cliente','nome','name','ragione']);
      if(!rows.length){flash(t('clients_empty'));return;}
      // figure out which header holds what, ONCE, from the keys
      const keys=Object.keys(rows[0]);
      const find=(...subs)=>keys.find(k=>{const kl=k.toLowerCase();return subs.some(s=>kl.includes(s));});
      const findPhone=()=>{
        // prefer office phone, then generic, then alternative
        return find('telefono ufficio','phone office','tel ufficio')||find('telefono','phone','tel ','cellulare','mobile','cell')||keys.find(k=>/tel|phone/i.test(k));
      };
      let companyKey=find('azienda','company','ragione','societ','cliente','account','ditta','denominazione');
      const contactKey=find('contatto','contact','referente','persona','nominativo','incaricato');
      const nameKey=find('nome','name');
      // if no explicit company column, the Nome/Name column IS the company
      if(!companyKey)companyKey=nameKey;
      const phoneKey=findPhone();
      const altPhoneKey=find('alternativ','secondario','mobile','cellulare');
      const emailKey=find('email','e-mail','mail');
      const roleKey=find('ruolo','role','posizione','titolo','qualifica');
      const addrKey=find('indirizzo','address','sede','città','citta','city');
      const g=(r,k)=>k?norm(r[k]):'';
      CLIENTS=rows.map(r=>({
        company:g(r,companyKey),
        contact:contactKey&&contactKey!==companyKey?g(r,contactKey):'',
        role:g(r,roleKey),
        email:g(r,emailKey),
        phone:g(r,phoneKey)||g(r,altPhoneKey),
        address:g(r,addrKey)
      })).filter(c=>c.company);
      if(!CLIENTS.length){flash(t('clients_empty'));return;}
      // keep the raw workbook + detected columns so we can write updates back to the SOURCE file
      CLIENTS_FILE.wb=wb;CLIENTS_FILE.sheetName=wb.SheetNames[0];CLIENTS_FILE.raw=rows;
      CLIENTS_FILE.keys={companyKey,contactKey,roleKey,emailKey,phoneKey,addrKey};
      $('#cliTxt').textContent='✓ '+CLIENTS.length+' '+t('clients');
      flash(t('clients_loaded').replace('%n',CLIENTS.length));
      if(step===0)render();
    }catch(err){console.error(err);flash(t('load_err'));}
  };
  reader.readAsArrayBuffer(file);
}
function parseRegistryRows(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const findSheet=(names)=>{for(const n of wb.SheetNames){if(names.some(x=>n.toLowerCase().includes(x)))return n;}return wb.SheetNames[0];};
  const sheet=wb.Sheets[findSheet(['offert','offer','registro'])];
  const rows=sheetRows(sheet,['progressivo','numero_offerta','numero offerta','prog']);
  return rows.map(r=>{
    const g=(...k)=>{for(const key of Object.keys(r)){const kl=key.toLowerCase();if(k.some(x=>kl.includes(x)))return r[key];}return '';};
    return {prog:g('progressivo','prog'),num:g('numero_offerta','numero offerta','offerta'),
      date:g('data','date'),client:g('cliente','client'),rep:g('referente','rep'),
      total:g('totale','total'),
      machine:g('macchina','machine'),
      addedOptionals:g('optional_aggiunti','added_optionals'),note:g('note','notes')};
  }).filter(r=>r.prog||r.num);
}
function handleRegistry(e){

    try{
      REGISTRY.rows=parseRegistryRows(ev.target.result);

      flash(t('registry_loaded').replace('%n',nextProgressivo()));

}
// re-read the shared registry file to see offers others may have added meanwhile
async function reloadRegistry(){

    if(REGISTRY.fileHandle&&REGISTRY.fileHandle.getFile){
      const f=await REGISTRY.fileHandle.getFile();

async function ensureRegistryHandle(){

    try{REGISTRY.fileHandle=await DIRHANDLE.getFileHandle(REGISTRY.fileName||'Registro_Offerte_DEPURECO_2026.xlsx',{create:true});return true;}catch(e){console.error(e);}

function buildRegistryBlob(){

  const aoa=[['DEPURECO — REGISTRO OFFERTE 2026'],[],header];

async function writeRegistryEntry(){
  const mkNum=p=>BRAND.offerPrefix+String(yr).slice(2)+'-'+String(p).padStart(3,'0');
  await ensureRegistryHandle();
  const linked=await reloadRegistry();               // pull colleagues' latest numbers if the file is shared
  // a recalled offer already carries its own "<original>_REVn" number (see doRecall) —
  // keep it as-is instead of assigning a fresh progressive one
  const isRevision=!!S.isRevisionOffer||/_REV\d+$/i.test(String(S.offerNum||''));
  let prog,num,used=new Set(REGISTRY.rows.map(r=>String(r.num).trim()));
  if(isRevision){
    num=S.offerNum;
    const m=String(num).match(/^[A-Z]+-\d{2}-(\d+)_REV\d+$/i);
    prog=m?parseInt(m[1],10):nextProgressivo();
  }else{
    // assign the first free number based on the freshest data
    prog=nextProgressivo();
    num=mkNum(prog);
    while(used.has(num)){prog++;num=mkNum(prog);}
  }
  const {grand}=lineTotals();
  const machineSummary=S.solutions.map(s=>`${s.code||''} (${s.name||''})${s.qty>1?' x'+s.qty:''}`).join(' | ');
  const addedOptSummary=S.solutions.map(s=>{
    const acc=(s.accessories||[]).filter(a=>a.code||a.desc);
    return acc.length?`[${s.code}] `+acc.map(a=>a.desc?`${a.code||''} - ${a.desc}`.replace(/^ - /,''):a.code).join('; '):'';
  }).filter(Boolean).join(' || ');
  const row={prog,num,date:S.date,client:S.client,rep:S.rep.name,total:Number(grand.toFixed(2)),
    machine:machineSummary,addedOptionals:addedOptSummary,note:''};
  REGISTRY.rows.push(row);S.offerNum=num;
  let saved=await writeRegistryBack();
  if(!saved) saved=await ensureRegistryHandleAndWrite();
  // guard against a same-moment race: re-read; if our number ended up duplicated, take the next free one and rewrite
  if(saved&&linked){
    try{
      if(await reloadRegistry()){
        const dup=REGISTRY.rows.filter(r=>String(r.num).trim()===num).length;
        const mine=REGISTRY.rows.some(r=>String(r.num).trim()===num&&String(r.client).trim()===String(S.client).trim());
        if(dup>1||!mine){
          used=new Set(REGISTRY.rows.map(r=>String(r.num).trim()));
          if(isRevision){
            const base=String(S.offerNum).replace(/_REV\d+$/i,'');
            let rev=1;while(used.has(base+'_REV'+rev))rev++;
            num=base+'_REV'+rev;
          }else{
            prog=nextProgressivo();num=mkNum(prog);while(used.has(num)){prog++;num=mkNum(prog);}
          }
          row.prog=prog;row.num=num;S.offerNum=num;REGISTRY.rows.push(row);
          await writeRegistryBack();
        }
      }
    }catch(_){}
  }
  return {saved,num};
}

// Shared restore logic: takes the parsed contents of a saved offer .json file and
// applies it to the live state S — used both by the folder-based recall (doRecall)
// and by the direct drag&drop / file-picker upload (restoreOfferFromUpload).
async function restoreOfferData(data,forcedBaseNum){
  if(!data||!data.__depurecoOffer||!data.state){ hideLoader(); flash(t('recall_invalid')); return false; }
  const st=data.state;
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S,st);
  // stored photos were session-only blob URLs and don't survive — clear them, then try to
  // re-fetch them by code from the currently linked images folder (same lookup used on folder link)
  S.solutions=(st.solutions||[]).map(s=>({...s,img:'',imgs:[],accessories:(s.accessories||[]).map(a=>({...a,img:''}))}));
  S.solutions.forEach(s=>{
    const u=imgUrlForCode(s.code);
    if(u){s.img=u;ensureImgs(s);if(!s.imgs.length)s.imgs.push(u);}
    s.accessories.forEach(a=>{const au=imgUrlForCode(a.code);if(au)a.img=au;});
  });
  const baseNum=String(forcedBaseNum||data.baseOfferNum||st.offerNum||'').replace(/_REV\d+$/i,'');
  try{ await ensureRegistryHandle(); }catch(_){}
  let maxRev=0;
  try{
    await reloadRegistry();
    const escNum=baseNum.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp('^'+escNum+'_REV(\\d+)$','i');
    REGISTRY.rows.forEach(r=>{const m=String(r.num||'').match(re);if(m)maxRev=Math.max(maxRev,parseInt(m[1],10));});
  }catch(_){}
  S.offerNum=baseNum+'_REV'+(maxRev+1);
  S.isRevisionOffer=true;
  step=0;maxReached=0;
  hideLoader();
  flash(t('offer_recalled').replace('%n',S.offerNum));
  render();
  return true;
}
// upload path: read a .json file the user drops or picks directly, no folder/PDF matching needed
// pulls just the "DPC-26-164" prefix out of a saved offer's file name, ignoring any
// existing _REVn suffix or trailing client-name segment — this is always taken as the
// source of truth for which offer is being revised, instead of trusting a field stored
// inside the JSON payload (which could in principle be stale or mismatched)
function extractBaseNumFromFilename(name){
  const base=String(name||'').replace(/\.(json|pdf)$/i,'');
  const m=base.match(/^([A-Z]+-\d{2}-\d+)/i);
  return m?m[1]:'';
}

}

// persist newly-entered client contact data (contact/role/phone/email) into a dedicated file in the linked folder
// write / overwrite the client's data directly into the SOURCE contacts file (xlsx)
function coreName(s){
  return String(s||'').trim().toLowerCase()
    .replace(/\b(s\.?r\.?l\.?|s\.?p\.?a\.?|s\.?a\.?s\.?|s\.?n\.?c\.?|s\.?c\.?a\.?r\.?l\.?|ltd\.?|inc\.?|gmbh|sarl|sl|nv|bv)\b/g,'')
    .replace(/[.,'"&\-]/g,' ').replace(/\s+/g,' ').trim();
}
async function saveClientToSource(){
  const company=(S.client||'').trim();if(!company)return {ok:false,reason:'no_company'};
  const norm2=s=>String(s||'').trim().toLowerCase();
  const incoming={company,contact:(S.contact||'').trim(),role:(S.role||'').trim(),phone:(S.phone||'').trim(),email:(S.email||'').trim()};
  const target=coreName(company);
  // update in-memory list for the autocomplete (exact match first, then fuzzy on the "core" business name)
  let c=CLIENTS.find(x=>norm2(x.company)===norm2(company)) || CLIENTS.find(x=>coreName(x.company)===target && target);
  if(!c){CLIENTS.push(incoming);} else {['contact','role','phone','email'].forEach(k=>{if(incoming[k])c[k]=incoming[k];});}
  if(!(CLIENTS_FILE.handle&&CLIENTS_FILE.handle.createWritable&&CLIENTS_FILE.raw&&CLIENTS_FILE.wb))return {ok:false,reason:'not_linked'};
  try{
    if(!(await ensurePerm(CLIENTS_FILE.handle)))return {ok:false,reason:'no_permission'};
    const K=CLIENTS_FILE.keys||{};
    const ck=K.companyKey||'Azienda', contactK=K.contactKey||'Referente', roleK=K.roleKey||'Ruolo',
          emailK=K.emailKey||'Email', phoneK=K.phoneKey||'Telefono';
    // exact match first; fall back to a fuzzy match ignoring legal-form suffixes/punctuation (e.g. "Violeta" ↔ "Violeta S.r.l.")
    let row=CLIENTS_FILE.raw.find(r=>norm2(r[ck])===norm2(company));
    if(!row && target) row=CLIENTS_FILE.raw.find(r=>coreName(r[ck])===target);
    const isNew=!row;
    if(!row){row={};row[ck]=company;CLIENTS_FILE.raw.push(row);}
    if(incoming.contact)row[contactK]=incoming.contact;
    if(incoming.role)row[roleK]=incoming.role;
    if(incoming.email)row[emailK]=incoming.email;
    if(incoming.phone)row[phoneK]=incoming.phone;
    const ws=XLSX.utils.json_to_sheet(CLIENTS_FILE.raw);
    CLIENTS_FILE.wb.Sheets[CLIENTS_FILE.sheetName]=ws;
    if(!CLIENTS_FILE.wb.SheetNames.includes(CLIENTS_FILE.sheetName))CLIENTS_FILE.wb.SheetNames.push(CLIENTS_FILE.sheetName);
    const out=XLSX.write(CLIENTS_FILE.wb,{bookType:'xlsx',type:'array'});
    const w=await CLIENTS_FILE.handle.createWritable();
    await w.write(new Blob([out]));await w.close();
    return {ok:true,isNew};
  }catch(e){console.error(e);return {ok:false,reason:'write_error'};}
}
async function saveClientIfNew(){
  // prefer writing straight into the source contacts file; fall back to a side CSV if it isn't linked/writable
  const res=await saveClientToSource();
  if(res.ok) return {target:'source', isNew:res.isNew};
  const company=(S.client||'').trim();if(!company)return {target:'none'};
  const norm=s=>String(s||'').trim().toLowerCase();
  const incoming={company,contact:(S.contact||'').trim(),role:(S.role||'').trim(),phone:(S.phone||'').trim(),email:(S.email||'').trim()};
  if(!(DIRHANDLE&&await ensurePerm(DIRHANDLE)))return {target:'none'};
  try{
    const fh=await DIRHANDLE.getFileHandle('Contatti_da_offerte_DEPURECO.csv',{create:true});
    const map={};
    try{const f=await fh.getFile();const txt=await f.text();
      txt.replace(/^\ufeff/,'').split(/\r?\n/).slice(1).forEach(line=>{if(!line.trim())return;const p=line.split(';');map[norm(p[0])]={company:p[0]||'',contact:p[1]||'',role:p[2]||'',phone:p[3]||'',email:p[4]||''};});
    }catch(_){}
    map[norm(company)]=incoming;
    const header='Nome;Referente;Ruolo;Telefono;Email';
    const rows=Object.values(map).map(x=>[x.company,x.contact,x.role,x.phone,x.email].map(v=>String(v||'').replace(/;/g,',')).join(';'));
    const w=await fh.createWritable();await w.write('\ufeff'+header+'\n'+rows.join('\n'));await w.close();
    return {target:'csv'};
  }catch(e){console.error(e);return {target:'none'};}
}

<script>
/* Generatore Offerte Depureco — modulo "folder-pdf" */
let DIRHANDLE=null;
let SAVEDIR=null;
function idbSet(k,v){return new Promise((res,rej)=>{const r=indexedDB.open('depureco',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{const tx=r.result.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);};
  r.onerror=()=>rej(r.error);});}
function idbGet(k){return new Promise(res=>{const r=indexedDB.open('depureco',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{try{const tx=r.result.transaction('kv','readonly');const g=tx.objectStore('kv').get(k);g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);}catch(_){res(null);}};
  r.onerror=()=>res(null);});}
function fakeEvent(file){return {target:{files:[file]}};}
async function linkFolder(){
  try{
    const h=await window.showDirectoryPicker();
    DIRHANDLE=h;try{await idbSet('dir',h);}catch(_){}
    await loadFromDir(h);
    flash(t('folder_linked'));
  }catch(e){if(e&&e.name!=='AbortError')console.error(e);}
}
function showLoader(title){
  let o=document.getElementById('loadOverlay');
  if(!o){o=document.createElement('div');o.id='loadOverlay';o.className='load-overlay';
    o.innerHTML='<div class="load-card"><div class="load-title" id="loadTitle"></div><div class="load-status" id="loadStatus"></div><div class="load-track"><div class="load-fill" id="loadFill"></div></div><div class="load-pct" id="loadPct"></div></div>';
    document.body.appendChild(o);}
  o.style.display='flex';document.getElementById('loadTitle').textContent=title||'';setLoader(-1,'');
}
function setLoader(pct,status){
  const f=document.getElementById('loadFill'),p=document.getElementById('loadPct'),s=document.getElementById('loadStatus');
  if(f){if(pct<0){f.classList.add('indet');}else{f.classList.remove('indet');f.style.width=Math.max(0,Math.min(100,pct))+'%';}}
  if(p)p.textContent=pct<0?'':Math.round(pct)+'%';
  if(s&&status!=null)s.textContent=status;
}
function hideLoader(){const o=document.getElementById('loadOverlay');if(o)o.style.display='none';}
function uiTick(){return new Promise(r=>requestAnimationFrame(()=>r()));}
async function collectImages(dir,arr,onprog){
  for await(const [n,e] of dir.entries()){
    if(e.kind==='directory')await collectImages(e,arr,onprog);
    else if(/\.(png|jpe?g|webp|gif)$/i.test(n)){arr.push({key:imgKey(n.replace(/\.[^.]+$/,'')),handle:e});if(onprog)onprog();}
  }
}
async function loadFromDir(h){
  showLoader(t('linking_title'));
  setLoader(-1,t('reading_folder'));await uiTick();
  Object.values(IMGCACHE).forEach(u=>{try{URL.revokeObjectURL(u);}catch(_){}});
  IMGMAP={};IMGCACHE={};
  const files=[],imgDirs=[];
  try{
    for await(const [name,entry] of h.entries()){
      const lo=name.toLowerCase();
      if(entry.kind==='file')files.push([name,entry]);
      else if(entry.kind==='directory'&&/(immagin|image|foto)/.test(lo))imgDirs.push({name,entry,lo});
    }
    // if a 2026 images folder exists, use ONLY that one (ignore older "Immagini" / "IMMAGINI LISTINO 2025" folders)
    const imgDirs2026=imgDirs.filter(d=>/2026/.test(d.lo));
    const activeImgDirs=(imgDirs2026.length?imgDirs2026:imgDirs).map(d=>d.entry);
    // 1) data files
    // optional matrix: with several versions in the folder the last one by name wins (e.g. ..._v2)
    const matFiles=files.filter(([n])=>/\.(xlsx|xls)$/i.test(n)&&/(matrice|optional)/i.test(n)&&!/^~\$/.test(n)).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
    if(matFiles.length){const me=matFiles[matFiles.length-1][1];setLoader(-1,t('loading_matrix'));await uiTick();handleMatrix(fakeEvent(await me.getFile()));}
    for(const [name,entry] of files){
      const lo=name.toLowerCase();
      if(/(matrice|optional)/.test(lo))continue;
      if(/\.(xlsx|xls)$/.test(lo)&&/(sorgente|listino|listing)/.test(lo)){setLoader(-1,t('loading_pricelist'));await uiTick();handleXlsx(fakeEvent(await entry.getFile()));}
      else if(/\.(xlsx|xls|csv)$/.test(lo)&&/(contatt|client|aziend)/.test(lo)){setLoader(-1,t('loading_clients'));await uiTick();CLIENTS_FILE.handle=entry;CLIENTS_FILE.name=name;handleClients(fakeEvent(await entry.getFile()));}
      else if(/\.(xlsx|xls)$/.test(lo)&&/(registro|offert|registry)/.test(lo)){setLoader(-1,t('loading_registry'));await uiTick();REGISTRY.fileHandle=entry;handleRegistry(fakeEvent(await entry.getFile()));}
    }
    // 2) images: get the list of image files fast (from last session's cached list when available,
    //    so we skip re-walking every folder), then read them all CONCURRENTLY in batches — much
    //    faster wall-clock time than one file at a time, especially over a network drive
    setLoader(-1,t('scanning_images').replace('%n','0'));await uiTick();
    let imgList=null;
    try{
      const cached=await idbGet('imgIndex');
      if(cached && cached.length) imgList=cached;
    }catch(_){}
    if(!imgList){
      imgList=[];let last=0;
      for(const d of activeImgDirs){await collectImages(d,imgList,()=>{if(imgList.length-last>=200){last=imgList.length;setLoader(-1,t('scanning_images').replace('%n',String(imgList.length)));}});}
      try{await idbSet('imgIndex',imgList);}catch(_){}
    }
    const total=imgList.length;let done=0;
    const CONCURRENCY=32;
    let idx=0;
    async function worker(){
      while(idx<imgList.length){
        const it=imgList[idx++];
        try{ IMGMAP[it.key]=await it.handle.getFile(); }catch(_){}
        done++;
        if(done%16===0||done===total){setLoader(total?done/total*100:100,t('loading_images_n').replace('%d',String(done)).replace('%t',String(total)));await uiTick();}
      }
    }
    await Promise.all(Array.from({length:Math.min(CONCURRENCY,Math.max(1,imgList.length))},worker));
    if($('#imgTxt'))$('#imgTxt').textContent='✓ '+total+' '+t('images');
    const imgCount=total;
    S.solutions.forEach(s=>{if(!s.img){const u=imgUrlForCode(s.code);if(u){s.img=u;ensureImgs(s);if(!s.imgs.length)s.imgs.push(u);}}
      s.accessories.forEach(a=>{if(!a.img){const u=imgUrlForCode(a.code);if(u)a.img=u;}});});
    if($('#linkTxt'))$('#linkTxt').textContent='✓ '+t('linked');
    setLoader(100,t('done'));await uiTick();
    return files.length+imgCount;
  } finally {
    setTimeout(hideLoader,350);
    render();
  }
}

// if the folder is linked but we don't yet have a writable registry handle, create/open it there
async function ensureRegistryHandleAndWrite(){

}
async function ensurePerm(h){try{if((await h.queryPermission({mode:'readwrite'}))==='granted')return true;return (await h.requestPermission({mode:'readwrite'}))==='granted';}catch(_){return false;}}
// resolve target folder: "Offerte fatte_<year>" inside the linked source folder (auto-rolls each year)
async function getSaveDir(){
  const folderName='Offerte fatte_'+yr;
  if(DIRHANDLE && await ensurePerm(DIRHANDLE)){
    try{
      if(/^Offerte fatte/i.test(DIRHANDLE.name||'')){ SAVEDIR=DIRHANDLE; return DIRHANDLE; }
      const off=await DIRHANDLE.getDirectoryHandle(folderName,{create:true});
      SAVEDIR=off; try{await idbSet('savedir',off);}catch(_){}
      return off;
    }catch(e){console.error(e);}
  }
  if(SAVEDIR && await ensurePerm(SAVEDIR)) return SAVEDIR;
  const h=await window.showDirectoryPicker(); SAVEDIR=h; try{await idbSet('savedir',h);}catch(_){}
  return h;
}
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const el=document.createElement('script');el.src=src;el.onload=()=>res();el.onerror=()=>rej(new Error('script '+src));document.head.appendChild(el);});}
function addCanvasPaged(pdf,canvas,first){
  const pw=210, ph=297;
  const imgH=canvas.width? canvas.height*pw/canvas.width : ph;
  if(imgH<=ph+0.6){ if(!first)pdf.addPage(); pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,imgH); return; }
  const pageHpx=Math.floor(canvas.width*ph/pw); let y=0, pnum=0;
  while(y<canvas.height){
    const sliceH=Math.min(pageHpx,canvas.height-y);
    const c=document.createElement('canvas');c.width=canvas.width;c.height=sliceH;
    c.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
    if(!(first&&pnum===0))pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,sliceH*pw/canvas.width);
    y+=sliceH; pnum++;
  }
}
async function svgToImg(svg,scale){
  const rect=svg.getBoundingClientRect();
  const w=Math.max(1,Math.round(rect.width))||100, h=Math.max(1,Math.round(rect.height))||100;
  const clone=svg.cloneNode(true);
  clone.setAttribute('width',w);clone.setAttribute('height',h);
  if(!clone.getAttribute('xmlns'))clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const svgStr=new XMLSerializer().serializeToString(clone);
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
  canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);
  const img=document.createElement('img');
  img.src=canvas.toDataURL('image/png');
  img.className=svg.getAttribute('class')||'';
  img.style.width=w+'px';img.style.height=h+'px';
  // the CSS that positioned/centered the original <svg> (e.g. ".clogo svg{margin:0 auto}") targets the
  // "svg" tag itself, which no longer matches once replaced by <img> — so copy the resolved layout explicitly
  const cs=getComputedStyle(svg);
  ['display','position','top','left','right','bottom','marginTop','marginRight','marginBottom','marginLeft','transform','transformOrigin'].forEach(p=>{
    const v=cs[p]; if(v && v!=='none' && v!=='auto')img.style[p]=v;
  });
  if(cs.display==='block' && (cs.marginLeft==='auto'||cs.marginRight==='auto')){img.style.display='block';img.style.marginLeft='auto';img.style.marginRight='auto';}
  return img;
}
async function buildPdfBlob(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF('p','mm','a4');
  document.body.classList.add('exporting');
  const root=document.querySelector('#view .pages');
  const pages=[...document.querySelectorAll('#view .pages .page')];
  if(!pages.length) throw new Error('no pages');
  // html2canvas' inline-SVG support is unreliable (logo/symbol can vanish) — rasterize each SVG to a PNG <img> before capture
  for(const svg of [...root.querySelectorAll('svg')]){
    try{ const img=await svgToImg(svg,3); svg.replaceWith(img); }catch(e){ console.error('svg->img failed',e); }
  }
  try{await document.fonts.ready;}catch(_){}
  await new Promise(r=>setTimeout(r,120));
  try{
    for(let i=0;i<pages.length;i++){
      const canvas=await html2canvas(pages[i],{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#ffffff',logging:false,imageTimeout:0,windowWidth:pages[i].scrollWidth,windowHeight:pages[i].scrollHeight});
      addCanvasPaged(pdf,canvas,i===0);
    }
    return pdf.output('blob');
  } finally { document.body.classList.remove('exporting'); stepQuote(); }
}
async function savePdfToFolder(){
  if(!window.showDirectoryPicker){flash(t('pdf_save_err'));return;}
  try{
    flash(t('saving_pdf'));
    const blob=await buildPdfBlob();
    const dir=await getSaveDir();
    const fh=await dir.getFileHandle(suggestedFilename()+'.pdf',{create:true});
    const w=await fh.createWritable(); await w.write(blob); await w.close();
    flash(t('pdf_saved'));
  }catch(e){ if(e&&e.name==='AbortError')return; console.error(e); flash(t('pdf_save_err')); }
}
async function restoreFolder(){
  if(!window.showDirectoryPicker)return;
  try{const sd=await idbGet('savedir');if(sd){if((await sd.queryPermission({mode:'readwrite'}))==='granted')SAVEDIR=sd;}}catch(_){}
  const h=await idbGet('dir');if(!h)return;
  try{
    const q=await h.queryPermission({mode:'readwrite'});
    if(q==='granted'){DIRHANDLE=h;await loadFromDir(h);}
    else if($('#linkTxt')){$('#linkTxt').textContent=t('reconnect');}  // needs one click to re-grant
  }catch(_){}
}
</script>
<script>
/* Generatore Offerte Depureco — modulo "xlsx-loader" */
function norm(s){return String(s==null?'':s).trim();}
function num(v){return parseFloat(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'))||0;}
// Read a sheet as objects, auto-detecting the header row (skips title/subtitle rows).
function sheetRows(sheet,markers){
  const aoa=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
  let hi=-1;
  for(let i=0;i<Math.min(aoa.length,15);i++){
    const cells=aoa[i].map(c=>norm(c).toLowerCase());
    if(markers.some(m=>cells.includes(m))){hi=i;break;}
  }
  if(hi<0)hi=0;
  const head=aoa[hi].map(c=>norm(c));
  const out=[];
  for(let i=hi+1;i<aoa.length;i++){
    const row=aoa[i];if(!row.some(c=>norm(c)!==''))continue;
    const o={};head.forEach((h,j)=>{if(h)o[h]=row[j]!=null?row[j]:'';});
    out.push(o);
  }
  return out;
}
function handleXlsx(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const out={machines:[],accessories:[],reps:[]};
      const findSheet=(names)=>{for(const n of wb.SheetNames){if(names.some(x=>n.toLowerCase().includes(x)))return n;}return null;};
      const sM=findSheet(['macchin','machine','máquina','machines']);
      const sA=findSheet(['access','accessor','accesori']);
      const sR=findSheet(['commerc','rep','referent','vendeur','vendedor']);
      if(sM){const rows=sheetRows(wb.Sheets[sM],['codice','code','código']);
        rows.forEach(r=>{
          const code=norm(r.Codice||r.Code||r.code||r.CODICE);if(!code)return;
          const get=(...k)=>{for(const key of k){if(r[key]!=null&&r[key]!=='')return r[key];}return '';};
          out.machines.push({code,
            family:norm(get('Famiglia','Family','family')),
            category:norm(get('Categoria','Category','category'))||'OTHER',
            name:norm(get('Nome','Name','name'))||code,
            desc:norm(get('Descrizione_EN','Descrizione','Description','desc')),
            atex:/^(si|sì|yes|x|true|1)$/i.test(norm(get('ATEX','Atex','atex'))),
            price:num(get('Prezzo','Prezzo_EUR','Price','Prezzo_L0','L0')),
            power:norm(get('Potenza','Power','power')),voltage:norm(get('Tensione','Voltage','voltage')),
            vacuum:norm(get('Depressione','Vacuum','vacuum')),airflow:norm(get('Portata_Aria','Airflow','airflow')),
            noise:norm(get('Rumorosita','Rumorosità','Noise','noise')),filter_type:norm(get('Tipo_Filtro','Filter type','filter_type')),
            filter_surface:norm(get('Sup_Filtrante','Filter surface','filter_surface')),capacity:norm(get('Capacita','Capacità','Capacity','capacity')),
            suction:norm(get('Bocca_Aspirazione','Suction','suction')),dimensions:norm(get('Dimensioni','Dimensions','dimensions')),
            weight:norm(get('Peso','Weight','weight')),marking:norm(get('Marcatura_ATEX','ATEX marking','marking')),
            application:norm(get('Applicazione','Application')),url:norm(get('URL','url')),image:norm(get('Immagine_URL','image'))});
        });}
      if(sA){const rows=sheetRows(wb.Sheets[sA],['codice','code','código']);
        rows.forEach(r=>{const code=norm(r.Codice||r.Code||r.code);if(!code)return;
          const get=(...k)=>{for(const key of k){if(r[key]!=null&&r[key]!=='')return r[key];}return '';};
          out.accessories.push({code,desc:norm(get('Descrizione','Description','desc')),
            price:num(get('Prezzo','Prezzo_EUR','Price','Prezzo_L0','L0'))});});}
      if(sR){const rows=sheetRows(wb.Sheets[sR],['nome','name','nombre','nom']);
        rows.forEach(r=>{const name=norm(r.Nome||r.Name||r.name);if(!name)return;
          out.reps.push({name,email:norm(r.Email||r.email),phone:norm(r.Telefono||r.Phone||r.phone)});});}
      if(!out.machines.length){flash(t('load_err'));return;}
      if(!out.reps.length)out.reps=EMBEDDED.reps;
      if(!out.accessories.length)out.accessories=EMBEDDED.accessories;
      // fusione col catalogo incorporato: il file può contenere solo codice + prezzo (matrice prezzi);
      // i dati tecnici restano quelli del catalogo, il file vince solo dove ha un valore.
      const base=new Map(EMBEDDED.machines.map(m=>[m.code,m]));
      const merged=new Map();
      out.machines.forEach(m=>{const b=base.get(m.code)||{};const r={...b};
        Object.keys(m).forEach(k=>{if(m[k]!==''&&m[k]!=null&&!(k==='atex'&&!m[k]&&b.atex))r[k]=m[k];});
        if(!m.price&&b.price)r.price=b.price;
        merged.set(m.code,r);});
      base.forEach((b,c)=>{if(!merged.has(c))merged.set(c,b);});   // modelli non presenti nel file: restano (senza prezzo)
      out.machines=[...merged.values()];
      DATA=out;loadedFromFile=true;loadedFileName=file.name;
      S.rep=DATA.reps[0]||S.rep;
      $('#xlsxTxt').textContent='✓ '+file.name;
      curCat=null;search='';
      flash(t('load_ok').replace('%n',DATA.machines.length));
      render();
    }catch(err){console.error(err);flash(t('load_err'));}
  };
  reader.readAsArrayBuffer(file);
}
</script>
